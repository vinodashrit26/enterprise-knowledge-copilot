[project]
name = "enterprise-knowledge-copilot"
version = "0.1.0"
description = "An AI-powered platform helping enterprise operations teams investigate onboarding issues, identify root causes, gather evidence, and plan safe, auditable remediation."
readme = "README.md"
authors = [
    { name = "Vinod Ashrit", email = "340693172+vinodashrit26@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
]

[project.scripts]
enterprise-knowledge-copilot = "enterprise_knowledge_copilot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=enterprise_knowledge_copilot --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["src/enterprise_knowledge_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
